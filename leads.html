<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prancheta de Leads | Smart Encartes</title>
  <style>
    :root { color-scheme: light; --bg:#f5f6f7; --surface:#fff; --text:#202124; --muted:#667085; --line:#e4e7ec; --accent:#e86209; --green:#067647; --red:#b42318; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 Inter,Segoe UI,Arial,sans-serif; }
    button,input,select { font:inherit; }
    header { background:#1e2227; color:#fff; border-bottom:3px solid var(--accent); }
    .header-inner,.page { width:min(1400px,calc(100% - 32px)); margin:auto; }
    .header-inner { min-height:64px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .brand { display:flex; align-items:center; gap:11px; }
    .brand-mark { width:34px; height:34px; display:grid; place-items:center; background:var(--accent); color:#fff; font-weight:800; border-radius:6px; }
    .brand strong { display:block; font-size:15px; }
    .brand span { display:block; color:#b9c0c8; font-size:12px; }
    .page { padding:24px 0 40px; }
    .stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); border:1px solid var(--line); background:var(--surface); border-radius:8px; overflow:hidden; margin-bottom:18px; }
    .stat { padding:17px 20px; border-right:1px solid var(--line); }
    .stat:last-child { border:0; }
    .stat span { display:block; color:var(--muted); font-size:12px; margin-bottom:4px; }
    .stat strong { font-size:24px; }
    .toolbar { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
    .search { min-width:260px; flex:1; max-width:460px; height:40px; border:1px solid var(--line); border-radius:6px; background:#fff; padding:0 12px; outline:none; }
    .search:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(232,98,9,.12); }
    .btn { min-height:40px; border:1px solid var(--line); background:#fff; color:var(--text); padding:0 13px; border-radius:6px; cursor:pointer; font-weight:600; }
    .btn:hover { border-color:#b9c0c8; background:#fafafa; }
    .table-shell { overflow:auto; background:var(--surface); border:1px solid var(--line); border-radius:8px; }
    table { width:100%; min-width:1020px; border-collapse:collapse; }
    th { position:sticky; top:0; z-index:1; background:#f9fafb; color:#475467; font-size:11px; text-align:left; text-transform:uppercase; padding:11px 13px; border-bottom:1px solid var(--line); }
    td { padding:13px; border-bottom:1px solid var(--line); vertical-align:middle; }
    tr:last-child td { border-bottom:0; }
    tr:hover td { background:#fcfcfd; }
    .person strong,.person span { display:block; }
    .person span,.muted { color:var(--muted); font-size:12px; }
    a { color:#175cd3; text-decoration:none; }
    a:hover { text-decoration:underline; }
    .score { font-weight:800; color:var(--green); }
    .status { width:126px; border:1px solid var(--line); border-radius:5px; padding:7px 8px; background:#fff; }
    .row-actions { display:flex; gap:6px; }
    .icon-btn { width:34px; height:34px; display:grid; place-items:center; padding:0; border:1px solid var(--line); border-radius:5px; background:#fff; cursor:pointer; }
    .icon-btn:hover { background:#f2f4f7; }
    .icon-btn.danger:hover { color:var(--red); border-color:#fecdca; background:#fef3f2; }
    .empty,.loading { padding:48px; text-align:center; color:var(--muted); }
    .error { color:var(--red); }
    dialog { width:min(720px,calc(100% - 24px)); max-height:85vh; border:0; border-radius:8px; padding:0; box-shadow:0 24px 60px rgba(0,0,0,.25); }
    dialog::backdrop { background:rgba(16,24,40,.55); }
    .dialog-head { display:flex; justify-content:space-between; align-items:center; padding:18px 20px; border-bottom:1px solid var(--line); }
    .dialog-head h2 { margin:0; font-size:18px; }
    .dialog-body { padding:20px; overflow:auto; max-height:calc(85vh - 65px); }
    .details { display:grid; grid-template-columns:1fr 1fr; gap:12px 24px; }
    .detail { border-bottom:1px solid var(--line); padding-bottom:10px; }
    .detail span { display:block; color:var(--muted); font-size:11px; text-transform:uppercase; margin-bottom:4px; }
    .detail strong { font-weight:600; }
    @media(max-width:760px){ .header-inner,.page{width:min(100% - 20px,1400px)} .stats{grid-template-columns:1fr 1fr}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid var(--line)}.toolbar{flex-wrap:wrap}.search{max-width:none;min-width:100%}.details{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <header><div class="header-inner"><div class="brand"><div class="brand-mark">S</div><div><strong>Smart Encartes</strong><span>Prancheta de leads</span></div></div><button class="btn" id="refreshBtn" type="button" title="Atualizar lista">Atualizar</button></div></header>
  <main class="page">
    <section class="stats" aria-label="Resumo">
      <div class="stat"><span>Total de leads</span><strong id="totalCount">0</strong></div>
      <div class="stat"><span>Novos</span><strong id="newCount">0</strong></div>
      <div class="stat"><span>Qualificados</span><strong id="qualifiedCount">0</strong></div>
      <div class="stat"><span>Fechados</span><strong id="closedCount">0</strong></div>
    </section>
    <div class="toolbar">
      <input class="search" id="searchInput" type="search" placeholder="Buscar por nome, WhatsApp ou e-mail" aria-label="Buscar leads" />
      <select class="status" id="statusFilter" aria-label="Filtrar por status"><option value="">Todos os status</option><option value="novo">Novo</option><option value="contatado">Contatado</option><option value="qualificado">Qualificado</option><option value="fechado">Fechado</option><option value="descartado">Descartado</option></select>
      <button class="btn" id="exportBtn" type="button">Exportar CSV</button>
    </div>
    <div class="table-shell" id="tableShell"><div class="loading">Carregando leads...</div></div>
  </main>
  <dialog id="detailsDialog"><div class="dialog-head"><h2 id="detailsTitle">Detalhes do lead</h2><button class="icon-btn" id="closeDialog" type="button" aria-label="Fechar" title="Fechar">&#10005;</button></div><div class="dialog-body"><div class="details" id="detailsBody"></div></div></dialog>
  <script>
    (() => {
      const statuses = ['novo','contatado','qualificado','fechado','descartado'];
      const statusLabels = { novo:'Novo',contatado:'Contatado',qualificado:'Qualificado',fechado:'Fechado',descartado:'Descartado' };
      const answerLabels = { perfil:'Perfil profissional',nicho:'Foco em supermercados',photoshop:'Uso do Photoshop',volume:'Volume diario',tempo50:'Tempo para 50 produtos',gargalo:'Principal gargalo',mais10:'Capacidade para mais 10 clientes',limite_processo_atual:'Limite do processo atual',capacidade_atual:'Capacidade atual' };
      function answerLabelsFor(lead){
        const profile=lead.answers?.perfil?.value||'';
        const owner=profile.startsWith('Dono');
        const autonomous=profile.includes('aut');
        return {...answerLabels,
          limite_processo_atual:autonomous?'Prioridade com mais tempo':'Tamanho da equipe de designers',
          capacidade_atual:owner?'Custo mensal da equipe':autonomous?'Receita mensal n\u00e3o captada':'Horas semanais perdidas pela equipe'
        };
      }
      let leads = [];
      const shell = document.getElementById('tableShell');
      const search = document.getElementById('searchInput');
      const filter = document.getElementById('statusFilter');
      const dialog = document.getElementById('detailsDialog');

      const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
      const formatDate = value => new Intl.DateTimeFormat('pt-BR',{dateStyle:'short',timeStyle:'short'}).format(new Date(value));
      const phoneText = value => { const n=String(value||''); return n.length===13 ? '+'+n.slice(0,2)+' ('+n.slice(2,4)+') '+n.slice(4,9)+'-'+n.slice(9) : '+'+n; };
      const visibleLeads = () => { const term=search.value.trim().toLowerCase(); return leads.filter(lead => (!filter.value || lead.status===filter.value) && (!term || [lead.name,lead.whatsapp,lead.email].some(value => String(value||'').toLowerCase().includes(term)))); };

      function updateStats(){
        document.getElementById('totalCount').textContent=leads.length;
        document.getElementById('newCount').textContent=leads.filter(x=>x.status==='novo').length;
        document.getElementById('qualifiedCount').textContent=leads.filter(x=>x.status==='qualificado').length;
        document.getElementById('closedCount').textContent=leads.filter(x=>x.status==='fechado').length;
      }

      function render(){
        updateStats();
        const items=visibleLeads();
        if(!items.length){ shell.innerHTML='<div class="empty">Nenhum lead encontrado.</div>'; return; }
        shell.innerHTML='<table><thead><tr><th>Data</th><th>Lead</th><th>WhatsApp</th><th>Perfil</th><th>Aderencia</th><th>Status</th><th>Acoes</th></tr></thead><tbody>'+items.map(lead=>{
          const result=lead.answers?.resultado||{};
          const profile=lead.answers?.perfil?.value||'-';
          const options=statuses.map(status=>'<option value="'+status+'"'+(lead.status===status?' selected':'')+'>'+statusLabels[status]+'</option>').join('');
          return '<tr><td><span class="muted">'+escapeHtml(formatDate(lead.createdAt))+'</span></td><td><div class="person"><strong>'+escapeHtml(lead.name)+'</strong><span>'+escapeHtml(lead.email||'Sem e-mail')+'</span></div></td><td><a href="https://wa.me/'+escapeHtml(lead.whatsapp)+'" target="_blank" rel="noopener">'+escapeHtml(phoneText(lead.whatsapp))+'</a></td><td>'+escapeHtml(profile)+'</td><td><span class="score">'+escapeHtml(result.percent??0)+'%</span></td><td><select class="status" data-status="'+escapeHtml(lead.id)+'">'+options+'</select></td><td><div class="row-actions"><button class="icon-btn" data-view="'+escapeHtml(lead.id)+'" type="button" title="Ver respostas" aria-label="Ver respostas">&#128065;</button><button class="icon-btn danger" data-delete="'+escapeHtml(lead.id)+'" type="button" title="Excluir lead" aria-label="Excluir lead">&#128465;</button></div></td></tr>';
        }).join('')+'</tbody></table>';
      }

      async function api(url,options={}){ const response=await fetch(url,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}}); if(!response.ok){ const data=await response.json().catch(()=>({})); throw new Error(data.error||'Falha na operacao.'); } return response.status===204?null:response.json(); }
      async function load(){ shell.innerHTML='<div class="loading">Carregando leads...</div>'; try{ const data=await api('/api/admin/leads'); leads=data.leads||[]; render(); }catch(error){ shell.innerHTML='<div class="empty error">'+escapeHtml(error.message)+'</div>'; } }
      async function updateStatus(id,status){ await api('/api/admin/leads/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({status})}); const lead=leads.find(item=>item.id===id); if(lead) lead.status=status; updateStats(); }
      async function removeLead(id){ const lead=leads.find(item=>item.id===id); if(!lead||!confirm('Excluir permanentemente o lead '+lead.name+'?')) return; await api('/api/admin/leads/'+encodeURIComponent(id),{method:'DELETE'}); leads=leads.filter(item=>item.id!==id); render(); }

      function showDetails(id){
        const lead=leads.find(item=>item.id===id); if(!lead)return;
        document.getElementById('detailsTitle').textContent=lead.name;
        const rows=[['Data',formatDate(lead.createdAt)],['WhatsApp',phoneText(lead.whatsapp)],['E-mail',lead.email||'-'],['Status',statusLabels[lead.status]||lead.status]];
        Object.entries(answerLabelsFor(lead)).forEach(([key,label])=>rows.push([label,lead.answers?.[key]?.value||'-']));
        const result=lead.answers?.resultado||{};
        rows.push(['Aderencia',(result.percent??0)+'%'],['Capacidade por designer','5-6 para ate 20 clientes'],['Capacidade atual',(result.currentClientCapacity||0)+' clientes'],['Capacidade com o Smart','Ate '+(result.automatedClientCapacity||20)+' clientes'],['Crescimento estimado','+'+(result.extraClients||0)+' clientes']);
        const body=document.getElementById('detailsBody'); body.textContent='';
        rows.forEach(([label,value])=>{ const item=document.createElement('div'); item.className='detail'; const small=document.createElement('span'); small.textContent=label; const strong=document.createElement('strong'); strong.textContent=value; item.append(small,strong); body.append(item); });
        dialog.showModal();
      }

      function exportCsv(){
        const headers=['Data','Nome','WhatsApp','E-mail','Status','Perfil','Aderencia','Capacidade atual','Capacidade Smart','Crescimento estimado','Origem'];
        const rows=visibleLeads().map(lead=>{const result=lead.answers?.resultado||{};return [lead.createdAt,lead.name,lead.whatsapp,lead.email,lead.status,lead.answers?.perfil?.value||'',result.percent??0,result.currentClientCapacity??0,result.automatedClientCapacity??20,result.extraClients??0,lead.source];});
        const safeCsv=value=>{const text=String(value??'');return /^[=+\-@]/.test(text)?"'"+text:text;};
        const csv=[headers,...rows].map(row=>row.map(value=>'"'+safeCsv(value).replace(/"/g,'""')+'"').join(';')).join('\r\n');
        const link=document.createElement('a'); link.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'})); link.download='leads-smart-encartes-'+new Date().toISOString().slice(0,10)+'.csv'; link.click(); URL.revokeObjectURL(link.href);
      }

      shell.addEventListener('change',event=>{ const id=event.target.dataset.status; if(id) updateStatus(id,event.target.value).catch(error=>{alert(error.message);load();}); });
      shell.addEventListener('click',event=>{ const view=event.target.closest('[data-view]'); const del=event.target.closest('[data-delete]'); if(view)showDetails(view.dataset.view); if(del)removeLead(del.dataset.delete).catch(error=>alert(error.message)); });
      search.addEventListener('input',render); filter.addEventListener('change',render);
      document.getElementById('refreshBtn').addEventListener('click',load);
      document.getElementById('exportBtn').addEventListener('click',exportCsv);
      document.getElementById('closeDialog').addEventListener('click',()=>dialog.close());
      dialog.addEventListener('click',event=>{ if(event.target===dialog)dialog.close(); });
      load();
    })();
  </script>
</body>
</html>
